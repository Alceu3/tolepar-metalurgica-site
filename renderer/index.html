<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Floating Avatar Assistant</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <div class="avatar-container">
        <div class="avatar-stack">
          <div class="avatar-wrapper">
            <img id="avatar-photo" class="avatar-media" src="./assets/avatar-photo.png" alt="Avatar" />
            <canvas id="lip-canvas" class="lip-canvas"></canvas>
          </div>
          <div class="text-overlay">
            <p id="assistant-text" class="assistant-text">Digite sua mensagem...</p>
            <input id="prompt-input" class="prompt-input" type="text" placeholder="Escreva e aperte Enter" autocomplete="off" />
          </div>
        </div>
      </div>
    </main>
    <script src="./app.js"></script>
  </body>
  </html>
